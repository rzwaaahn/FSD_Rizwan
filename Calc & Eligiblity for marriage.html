<html> 
<head> 
    <title>Mini Project: Forms & Functions</title> 
    <style> 
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f0f8ff; 
            margin: 20px; 
        } 
 
        h1 { 
            text-align: center; 
            color: #333; 
        } 
 
        .container { 
            width: 50%; 
            margin: 0 auto; 
            background-color: white; 
            padding: 20px; 
            border-radius: 10px;  
            box-shadow: 0px 0px 10px gray;  
        } 
 
        form { 
            margin-bottom: 20px; 
            padding: 15px; 
            border: 1px solid #ccc; 
            border-radius: 5px; 
        } 
 
        h3 { 
            margin-top: 0; 
            color: #007BFF; 
            border-bottom: 2px solid #007BFF; 
            padding-bottom: 5px; 
        } 
 
        input, select { 
            padding: 8px; 
            margin: 5px 0; 
            width: 95%;  
            border: 1px solid #ccc; 
            border-radius: 4px; 
        } 
 
        button { 
            background-color: #28a745; 
            color: white; 
            padding: 10px 15px; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold; 
            margin-top: 10px; 
        } 
 
        button:hover { 
            background-color: #218838; 
        } 
 
         
        .calc-btn { 
            width: 22%; 
            background-color: #007BFF; 
        } 
 
        .result-box { 
            margin-top: 10px; 
            font-weight: bold; 
            color: #d63384; 
            font-size: 18px; 
        } 
    </style> 
</head> 
<body> 
 
    <div class="container"> 
 
        <form> 
            <h3>             Calculator</h3> 
            <label>Enter 1st Number:</label> 
            <input type="number" id="num1" placeholder="e.g. 10"> 
             
            <label>Enter 2nd Number:</label> 
            <input type="number" id="num2" placeholder="e.g. 5"> 
 
            <br> 
            <button type="button" class="calc-btn" onclick="calculate('+')">+</button> 
            <button type="button" class="calc-btn" onclick="calculate('-')">-</button> 
            <button type="button" class="calc-btn" onclick="calculate('*')">×</button> 
            <button type="button" class="calc-btn" onclick="calculate('/')">÷</button> 
 
            <div class="result-box" id="calcOutput">Result: -</div> 
        </form> 
        <br><br> 
        <form> 
            <h3>     Marriage Eligibility</h3> 
            <label>Select Gender:</label> 
            <select id="gender"> 
                <option value="m">Male</option> 
                <option value="f">Female</option> 
            </select> 
 
            <label>Enter Age:</label> 
            <input type="number" id="age" placeholder="e.g. 21"> 
 
            <button type="button" onclick="checkMarriage()">Check Status</button> 
 
            <div class="result-box" id="marriageOutput">Status: -</div> 
        </form> 
    </div> 
 
    <script> 
        
        // LOGIC USING ARROW FUNCTIONS 
 
        //  1. CALCULATOR LOGIC  
         
        // Arrow functions for basic math 
        let add = (a, b) => a + b; 
        let sub = (a, b) => a - b; 
        let mul = (a, b) => a * b; 
        let div = (a, b) => a / b; 
 
         
        let calculate = (operator) => { 
             
            let n1 = Number(document.getElementById("num1").value); 
            let n2 = Number(document.getElementById("num2").value); 
            let res = 0; 
 
            if(operator === '+') res = add(n1, n2); 
            else if(operator === '-') res = sub(n1, n2); 
            else if(operator === '*') res = mul(n1, n2); 
            else if(operator === '/') res = div(n1, n2); 
 
             
            document.getElementById("calcOutput").innerHTML = "Result: " + res; 
        }; 
 
        // 2. MARRIAGE LOGIC  
 
         
        let getStatus = (g, a) => { 
            if (g === "m" && a >= 21) { 
                return "Eligible for Marriage    "; 
            }  
            else if (g === "f" && a >= 18) { 
                return "Eligible for Marriage    "; 
            }  
            else { 
                return "Not Eligible   "; 
            } 
        }; 
 
         
        let checkMarriage = () => { 
             
            let gender = document.getElementById("gender").value; 
            let age = Number(document.getElementById("age").value); 
 
             
            let resultMessage = getStatus(gender, age); 
 
             
            document.getElementById("marriageOutput").innerHTML = "Status: " + 
resultMessage; 
        }; 
 
    </script> 
</body> 
</html>
